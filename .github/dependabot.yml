# Version updates are deliberately quiet: one grouped pull request per ecosystem, once a
# month, and no major-version jumps (those can break the build and need a manual look; check
# for them yourself from time to time). Security updates are separate and unaffected.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cargo-patch:
        update-types: [patch]
    ignore:
      # Cargo treats a minor bump of a 0.x crate (for example rusqlite 0.32 to 0.40) as breaking.
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
